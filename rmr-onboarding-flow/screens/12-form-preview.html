<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal Preview – Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/rmr.css">
<link rel="stylesheet" href="../assets/proto.css">
<style>
/* Preview-only: the form step shown by the RMX Form Designer's "Portal Preview" (no header or menu). */
/* The frame is fixed-height and the page does not scroll, so the preview fills it and the form scrolls inside. */
.preview { position: relative; display: flex; flex-direction: column; height: 100vh; overflow: clip; isolation: isolate; }
.preview .main { flex: 1 1 auto; min-height: 0; }
.preview .portal-bg { z-index: 0; }
.preview .main { z-index: 1; }
/* The questions look exactly like the form in the onboarding (10-pet-information): bold question, hint under it, full-width fields. */
.form-grid { display: flex; flex-direction: column; gap: var(--spacing-xl); align-items: stretch; }
.form-grid .question { padding: 0; gap: 0; }
.form-grid .question__text { font-weight: 700; letter-spacing: 0; }
.form-grid .question__hint { margin: 4px 0 0; padding-left: 0; font-size: var(--font-size-xs); line-height: 16px; }
.form-grid .question__slot { padding-left: 0; margin-top: var(--spacing-xs); }
.form-grid .question__slot > .input, .form-grid .question__slot > .dropdown, .form-grid .question__slot > .attach { width: 100%; }
.form-grid .question__slot .dropdown .input { width: 100%; }
.form-grid .question--row .question__slot { flex-direction: row; gap: var(--spacing-xl); }
.form-grid .question--checks .question__slot { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-xs) var(--spacing-xl); width: 50%; }
.input--area { align-items: flex-start; height: 91px; }
.input--area textarea { flex: 1 1 0; height: 100%; padding: 0; border: 0; outline: 0; resize: none; background: transparent; font-family: inherit; font-size: var(--font-size-sm); line-height: var(--line-height-md); letter-spacing: 0.28px; color: var(--text-primary); }
.input--area textarea::placeholder { font-style: italic; color: var(--text-accent); opacity: 1; }
.btn[disabled] { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="preview">
<main class="main" data-component="Main Content">
<div class="context-bar" data-component="Context Bar"><div class="context-bar__bg"><img src="../assets/img/context-bar.png" alt=""></div><h1 class="context-bar__title">Form</h1></div>
<section class="step-card step-card--fit" data-component="DTS">
  <div class="step-card__head" data-component="Header"><h2 class="step-card__title">Basic Info</h2><p class="step-card__subtitle">Please fill in the below information</p></div>
  <div id="questions" class="form-grid">
  <div class="question" data-component="Question">
    <p class="question__text">1. Do you have pets?*</p>
    <div class="question__slot">
      <label class="radio" data-component="Radio Button"><input type="radio" name="has-pets" value="yes"><span class="radio__mark"></span><span>Yes</span></label>
      <label class="radio" data-component="Radio Button"><input type="radio" name="has-pets" value="no"><span class="radio__mark"></span><span>No</span></label>
    </div>
  </div>
  </div>
</section>
<div class="footer-buttons" data-component="Footer Buttons">
  <button type="button" class="btn btn--secondary" data-component="Button" disabled><span class="btn__container">Back</span></button>
  <button type="button" class="btn btn--primary" data-component="Button"><span class="btn__container">Next</span></button>
</div>
</main>
<div class="portal-bg" data-component="rmResident Portal Background" aria-hidden="true"><img src="../assets/img/rmrp-bg.svg" alt=""></div>
</div>
<script>
/* Renders the form as last saved in the Form Designer (sessionStorage); the static question above is the fallback. */
(function () {
  var saved;
  try { saved = JSON.parse(sessionStorage.getItem('rmx-onboarding-form') || 'null'); } catch (e) {}
  if (!saved) return;
  function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
  var n = 0;
  var PH = 'Enter your answer';
  document.getElementById('questions').innerHTML = saved.map(function (f, i) {
    if (f.type === 'tx') return '<div class="question" data-component="Question"><p class="question__text">' + esc(f.title) + '</p></div>';
    if (f.type === 'at') return '<div class="question" data-component="Question">' + (f.title ? '<p class="question__text">' + esc(f.title) + '</p>' : '') + '<div class="question__slot"><a class="btn--text" href="#" data-component="Button"><img src="../assets/img/file-download.svg" alt="" width="20" height="20"><span>' + esc(f.file || 'No file attached') + '</span></a></div></div>';
    n++;
    var o = (f.opts && f.opts[f.type]) || [], name = 'q' + i, slot, cls = '';
    if (f.type === 'mc') { cls = ' question--row'; slot = o.map(function (v) { return '<label class="radio" data-component="Radio Button"><input type="radio" name="' + name + '"><span class="radio__mark"></span><span>' + esc(v) + '</span></label>'; }).join(''); }
    else if (f.type === 'cb') { cls = ' question--checks'; slot = o.map(function (v) { return '<label class="checkbox" data-component="Checkbox"><input type="checkbox" name="' + name + '"><span class="checkbox__box"><img src="../assets/img/checkbox-check.svg" alt="" width="20" height="20"></span><span>' + esc(v) + '</span></label>'; }).join(''); }
    else if (f.type === 'dd') slot = '<div class="dropdown" data-dropdown data-component="Dropdown"><div class="input input--select"><button type="button" class="dropdown__trigger" data-placeholder="Select your answer" aria-haspopup="listbox" aria-expanded="false"></button><img src="../assets/img/dropdown-20.svg" alt="" width="20" height="20"></div><input type="hidden" name="' + name + '"><div class="dropdown__panel" role="listbox" hidden>' + o.map(function (v) { return '<div class="dropdown__item" role="option" data-value="' + esc(v) + '">' + esc(v) + '</div>'; }).join('') + '</div></div>';
    else if (f.type === 'pa') slot = '<div class="input input--area" data-component="Input field"><textarea name="' + name + '" placeholder="' + PH + '"></textarea></div>';
    else if (f.type === 'dt') slot = '<div class="input" data-component="Input field"><input type="text" name="' + name + '" placeholder="mm/dd/yyyy" autocomplete="off"><img src="../assets/img/calendar-today.svg" alt="" width="20" height="20"></div>';
    else if (f.type === 'fl') slot = '<label class="attach" data-component="Attach"><input type="file" name="' + name + '"><img src="../assets/img/file-download.svg" alt="" width="32" height="32"><span class="attach__text"><span class="link">Choose a file</span> or drag it here.</span></label>';
    else slot = '<div class="input" data-component="Input field"><input type="text" name="' + name + '" placeholder="' + PH + '" autocomplete="off"></div>';
    var title = f.title || f.fallback || (f.type === 'fl' ? 'Untitled File Upload' : 'Untitled Question');
    return '<div class="question' + cls + '" data-component="Question"><p class="question__text">' + n + '. ' + esc(title) + (f.required ? ' *' : '') + '</p>' +
      (f.help ? '<p class="question__hint">' + esc(f.help) + '</p>' : '') + '<div class="question__slot">' + slot + '</div></div>';
  }).join('');
})();
</script>
<script src="../assets/app.js"></script>
</body>
</html>
